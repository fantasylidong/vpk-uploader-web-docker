{% extends "base.html" %}
{% block title %}Docker 管理 · VPK Uploader{% endblock %}
{% block body_class %}page-admin{% endblock %}
{% block content %}
<section class="docker-page" data-docker-dashboard>
  <div class="page-heading page-heading--primary">
    <div><h1>Docker 管理</h1><p>容器状态、资源占用和文件目录</p></div>
    <div class="heading-actions"><button type="button" data-refresh>刷新</button><a class="btn secondary" href="/admin">返回文件管理</a></div>
  </div>
  <div class="error" data-error role="alert" hidden></div>
  <div class="docker-summary" data-summary></div>
  <div class="container-grid" data-containers><p class="muted">正在读取 Docker 数据...</p></div>
</section>
<dialog class="file-dialog" data-file-dialog aria-labelledby="docker-file-dialog-title">
  <div class="dialog-heading"><div><h2 id="docker-file-dialog-title" data-file-title>容器文件</h2><code data-current-path>/</code></div><button type="button" class="secondary" data-close>关闭</button></div>
  <div class="file-toolbar"><button type="button" class="secondary" data-parent>上级目录</button><button type="button" data-file-refresh>刷新</button></div>
  <div class="file-listing" data-files tabindex="-1"></div>
</dialog>
<script src="/static/docker-dashboard.js" defer></script>
{% endblock %}
