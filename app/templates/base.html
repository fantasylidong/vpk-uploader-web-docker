<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VPK Uploader{% endblock %}</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/upload-progress.js" defer></script>
  <script src="/static/vpk-files.js" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="/" aria-label="VPK Uploader 首页">
        <span class="brand-mark" aria-hidden="true">VPK</span>
        <span class="brand-name">Uploader</span>
      </a>
      <nav class="primary-nav" aria-label="主要导航">
        <a class="nav-public" href="/">公共上传</a>
        <a class="nav-admin" href="/admin">管理</a>
      </nav>
    </div>
  </header>
  <main id="main-content" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="site-footer__inner">
      <span>VPK Uploader</span>
      <span>VPK / ZIP / RAR / 7Z</span>
    </div>
  </footer>
</body>
</html>
