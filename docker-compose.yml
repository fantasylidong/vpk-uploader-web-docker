services:
  uploader:
    build: .
    ports:
      - "8080:8080"
    environment:
      - APP_SECRET=replace-with-a-long-random-string
      - ADMIN_USER=admin
      - ADMIN_PASS=admin123
      - MAX_UPLOAD_MB=1024
      - MAX_TOTAL_UPLOAD_MB=${MAX_TOTAL_UPLOAD_MB:-0}
      - CHUNK_UPLOAD_SIZE_MB=${CHUNK_UPLOAD_SIZE_MB:-8}
      - CHUNK_UPLOAD_PARALLELISM=${CHUNK_UPLOAD_PARALLELISM:-4}
      - CHUNK_UPLOAD_MAX_AGE_HOURS=${CHUNK_UPLOAD_MAX_AGE_HOURS:-48}
      - CHUNK_UPLOAD_DISK_RESERVE_MB=${CHUNK_UPLOAD_DISK_RESERVE_MB:-512}
      - CHUNK_UPLOAD_MAX_ACTIVE_SESSIONS=${CHUNK_UPLOAD_MAX_ACTIVE_SESSIONS:-64}
      - CHUNK_UPLOAD_MAX_SESSIONS_PER_CLIENT=${CHUNK_UPLOAD_MAX_SESSIONS_PER_CLIENT:-4}
      - DEFAULT_GUEST_TTL_HOURS=24
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - INSTANCE_NAME=${INSTANCE_NAME:-本机节点}
      - FEDERATION_API_TOKEN=${FEDERATION_API_TOKEN:-}
      - FEDERATION_ALLOWED_CIDRS=${FEDERATION_ALLOWED_CIDRS:-}
      - LAN_REPLICATION_ENABLED=${LAN_REPLICATION_ENABLED:-1}
      - LAN_NODE_ID=${LAN_NODE_ID:-}
      - LAN_GROUP=${LAN_GROUP:-}
      - LAN_PEER_API_TOKEN=${LAN_PEER_API_TOKEN:-}
      - LAN_PEER_ALLOWED_CIDRS=${LAN_PEER_ALLOWED_CIDRS:-}
      - LAN_PEERS=${LAN_PEERS:-[]}
      - LAN_DISK_RESERVE_MB=${LAN_DISK_RESERVE_MB:-1024}
      - LAN_PEER_TLS_VERIFY=${LAN_PEER_TLS_VERIFY:-1}
      - LAN_ALLOW_PUBLIC_PEERS=${LAN_ALLOW_PUBLIC_PEERS:-0}
      - STEAM_WORKSHOP_APPID=${STEAM_WORKSHOP_APPID:-550}
      - STEAM_WORKSHOP_TIMEOUT_SECONDS=${STEAM_WORKSHOP_TIMEOUT_SECONDS:-1800}
      - STEAM_WORKSHOP_RETRIES=${STEAM_WORKSHOP_RETRIES:-3}
      - STEAM_WORKSHOP_MAX_QUEUED_JOBS=${STEAM_WORKSHOP_MAX_QUEUED_JOBS:-32}
      - STEAM_WORKSHOP_DIRECT_DOWNLOAD=${STEAM_WORKSHOP_DIRECT_DOWNLOAD:-1}
      - STEAM_WORKSHOP_ENFORCE_APPID=${STEAM_WORKSHOP_ENFORCE_APPID:-1}
      - STEAM_WORKSHOP_JOB_RETENTION_HOURS=${STEAM_WORKSHOP_JOB_RETENTION_HOURS:-72}
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data
      - ./rules.yml:/app/rules.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
